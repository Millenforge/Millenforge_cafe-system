<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Café | My Orders</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .layout {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            margin-bottom: 20px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Live Tracking Card */
        .live-order-card {
            background: linear-gradient(135deg, rgba(212, 163, 115, 0.1), var(--panel-bg));
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .pulse-indicator {
            position: absolute;
            top: 20px; right: 20px;
            width: 12px; height: 12px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(42, 157, 143, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(42, 157, 143, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(42, 157, 143, 0); }
            100% { box-shadow: 0 0 0 0 rgba(42, 157, 143, 0); }
        }

        .tracking-steps {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            position: relative;
        }

        .tracking-steps::before {
            content: '';
            position: absolute;
            top: 15px; left: 10%; right: 10%;
            height: 2px;
            background: var(--panel-border);
            z-index: 1;
        }

        .step {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 80px;
        }

        .step-icon {
            width: 32px; height: 32px;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: 0.5s;
        }

        .step.active .step-icon {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
        }

        .step.completed .step-icon {
            background: var(--success);
            border-color: var(--success);
            color: #fff;
        }

        .step-label { font-size: 0.8rem; color: var(--text-muted); }
        .step.active .step-label { color: var(--accent-color); font-weight: bold; }

        /* History List */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .history-item {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-info h4 { margin-bottom: 5px; }
        .history-info p { color: var(--text-muted); font-size: 0.85rem; }
        
        .history-meta { text-align: right; }
        .history-price { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); margin-bottom: 5px; }
        .status-badge { 
            font-size: 0.75rem; 
            padding: 4px 10px; 
            border-radius: 20px; 
            background: rgba(255,255,255,0.1);
        }
        .status-ready { background: rgba(42, 157, 143, 0.2); color: var(--success); }

    </style>
</head>
<body>

    <nav class="navbar glass-panel" style="border-radius: 0; border-bottom: 1px solid var(--panel-border);">
        <a href="menu.html" class="navbar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" y1="2" x2="6" y2="4"></line><line x1="10" y1="2" x2="10" y2="4"></line><line x1="14" y1="2" x2="14" y2="4"></line></svg>
            <span>Smart</span>Café
        </a>
        
        <ul class="nav-links">
            <li><a href="menu.html">Menu</a></li>
            <li><a href="booking.html">Book a Table</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
            <li><a href="dashboard.html" style="color: var(--accent-color)">My Orders</a></li>
        </ul>

        <div class="nav-actions">
            <button class="btn-icon" onclick="window.location.href='cart.html'" style="position: relative; display: flex; align-items: center; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span id="cart-badge" class="badge" style="display:none;">0</span>
            </button>
            <div class="nav-profile" onclick="window.location.href='profile.html'" title="My Profile" style="width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent-color); overflow: hidden; cursor: pointer; margin-left: 10px; display: flex; align-items: center; justify-content: center;">
                <img src="" alt="P" id="navProfilePic" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                <svg id="profilePlaceholder" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <button class="btn-icon" onclick="App.logout()" title="Logout" style="color: var(--danger); border-color: var(--danger); margin-left: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>
    </nav>

    <div style="padding: 20px 5%; margin-top: 10px;">
        <a href="menu.html" class="back-btn" style="margin-bottom: 20px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Back
        </a>
        <h2 class="section-title" style="margin-top: 10px;">📜 Order History</h2>
    </div>

    <div class="layout animate-fade-in">
        
        <div id="live-order-section" style="display: none;">
            <div class="live-order-card">
                <div class="pulse-indicator"></div>
                <h3 id="live-order-id">Order #---</h3>
                <p style="color: var(--text-muted); margin-top: 5px;" id="live-order-items">---</p>
                
                <div class="tracking-steps">
                    <div class="step completed" id="step-1">
                        <div class="step-icon">✓</div>
                        <div class="step-label">Received</div>
                    </div>
                    <div class="step active" id="step-2">
                        <div class="step-icon">🔥</div>
                        <div class="step-label">Preparing</div>
                    </div>
                    <div class="step" id="step-3">
                        <div class="step-icon">🛵</div>
                        <div class="step-label">On Way</div>
                    </div>
                </div>
                <button class="btn-primary" style="width: 100%; margin-top: 25px;" onclick="window.location.href='tracking.html'">
                    Open Live Map Tracking
                </button>
            </div>
        </div>


        <div class="history-list" id="history-list">
            <!-- Populated by JS -->
        </div>

    </div>

    <!-- Feedback Modal -->
    <div class="modal-overlay" id="feedbackModal">
        <div class="modal-content glass-panel" style="max-width: 450px; text-align: center;">
            <div class="modal-header">
                <h2>Rate Your Experience</h2>
                <button class="modal-close" onclick="App.closeModal('feedbackModal')">×</button>
            </div>
            
            <p style="color: var(--text-muted); margin-bottom: 20px;">How was your order <span id="feedbackOrderId" style="color: var(--accent-color); font-weight: bold;"></span>?</p>

            <div style="font-size: 2.5rem; cursor: pointer; margin-bottom: 20px;" id="starRating">
                <span data-val="1" onclick="setRating(1)">☆</span>
                <span data-val="2" onclick="setRating(2)">☆</span>
                <span data-val="3" onclick="setRating(3)">☆</span>
                <span data-val="4" onclick="setRating(4)">☆</span>
                <span data-val="5" onclick="setRating(5)">☆</span>
            </div>

            <div class="input-group" style="text-align: left;">
                <label>Additional Comments</label>
                <input type="text" id="feedbackComment" placeholder="Tell us what you liked...">
            </div>

            <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="submitFeedback()">
                Submit Feedback
            </button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const orders = JSON.parse(localStorage.getItem('smartCafeOrders')) || [];
            
            // Check if there is an active order
            const activeOrderIndex = orders.findIndex(o => o.status === 'Preparing');
            
            if (activeOrderIndex >= 0) {
                const activeOrder = orders[activeOrderIndex];
                document.getElementById('live-order-section').style.display = 'block';
                document.getElementById('live-order-id').innerText = `Order ${activeOrder.id}`;
                document.getElementById('live-order-items').innerText = activeOrder.items.map(i => `${i.quantity}x ${i.name}`).join(', ');

                // Mock status progression for dashboard preview
                setTimeout(() => {
                    const s2 = document.getElementById('step-2');
                    const s3 = document.getElementById('step-3');
                    if(s2 && s3) {
                        s2.classList.remove('active');
                        s2.classList.add('completed');
                        s3.classList.add('active');
                        App.showToast('Your order is on the way! 🛵', 'success');
                    }
                }, 5000); 
            }

            renderHistory();

            function renderHistory() {
                const list = document.getElementById('history-list');
                const allOrders = JSON.parse(localStorage.getItem('smartCafeOrders')) || [];
                
                if(allOrders.length === 0){
                    list.innerHTML = `<div style="text-align:center; padding: 30px; color:var(--text-muted);">No orders yet.</div>`;
                    return;
                }

                list.innerHTML = allOrders.map((order, i) => `
                    <div class="history-item stagger-${(i%3)+1} animate-fade-in">
                        <div class="history-info">
                            <h4>Order ${order.id}</h4>
                            ${order.customerName ? `<p style="color: var(--accent-color); font-weight: bold; margin-bottom: 2px;">Name: ${order.customerName}</p>` : ''}
                            <p>${order.date}</p>
                            <p style="margin-top:5px; font-size:0.9rem;">${order.items.map(item => {
                                const opts = item.options ? Object.entries(item.options).map(([k, v]) => `${v}`).join(', ') : '';
                                return `${item.quantity}x ${item.name}${opts ? ` (${opts})` : ''}`;
                            }).join(', ')}</p>
                        </div>
                        <div class="history-meta">
                            <div class="history-price">₹${order.total}</div>
                            <span class="status-badge ${order.status === 'Ready' || order.status === 'Completed' || order.status === 'Delivered' ? 'status-ready' : ''}" style="margin-bottom: 10px; display: inline-block;">${order.status}</span>
                            ${(order.status === 'Ready' || order.status === 'Completed' || order.status === 'Delivered') && !order.feedback ? `
                                <div><button class="btn-primary" style="padding: 5px 12px; font-size: 0.8rem;" onclick="openFeedback('${order.id}', ${i})">Rate Order</button></div>
                            ` : order.feedback ? `
                                <div style="font-size:0.8rem; color:var(--accent-color); margin-top:5px;">Rated: ${'★'.repeat(order.feedback.rating)}</div>
                                ${order.feedback.comment ? `<div style="font-size:0.75rem; color:var(--text-muted); font-style:italic; margin-top:2px;">"${order.feedback.comment}"</div>` : ''}
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            }
        });

        let currentFeedbackIndex = null;
        let currentRating = 0;

        function openFeedback(orderId, index) {
            currentFeedbackIndex = index;
            document.getElementById('feedbackOrderId').innerText = orderId;
            setRating(0); // reset
            document.getElementById('feedbackComment').value = '';
            App.openModal('feedbackModal');
        }

        function setRating(rating) {
            currentRating = rating;
            const stars = document.getElementById('starRating').children;
            for(let i=0; i<stars.length; i++) {
                stars[i].innerText = i < rating ? '★' : '☆';
                stars[i].style.color = i < rating ? 'var(--accent-color)' : 'var(--text-main)';
            }
        }

        function submitFeedback() {
            if(currentRating === 0) {
                App.showToast('Please select a star rating.', 'error');
                return;
            }

            const comment = document.getElementById('feedbackComment').value;
            const orders = JSON.parse(localStorage.getItem('smartCafeOrders')) || [];
            
            if(orders[currentFeedbackIndex]) {
                orders[currentFeedbackIndex].feedback = { rating: currentRating, comment };
                localStorage.setItem('smartCafeOrders', JSON.stringify(orders));
            }

            App.closeModal('feedbackModal');
            App.showToast('Thank you for your feedback! 💖', 'success');
            
            // Re-render to show "Rated"
            location.reload(); // simple way to refresh the list
        }
    </script>
</body>
</html>
