<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Café | Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .layout {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 15px;
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
        }

        .item-details { flex: 1; }
        .item-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; }
        .item-options { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 10px; }
        
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 5px 10px;
            border-radius: 20px;
            width: fit-content;
        }

        .quantity-controls button {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            width: 25px;
        }

        .item-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.5rem;
            padding: 5px;
        }

        /* Order Summary */
        .summary-card {
            background: var(--panel-bg);
            border: 1px solid var(--accent-color);
            padding: 25px;
            border-radius: 20px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .summary-title { margin-bottom: 20px; font-size: 1.5rem; }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .summary-row.total {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            border-top: 1px solid var(--panel-border);
            padding-top: 15px;
            margin-top: 15px;
        }

        /* Loyalty Integration in Cart */
        .loyalty-card-cart {
            background: linear-gradient(135deg, rgba(212, 163, 115, 0.15), rgba(42, 157, 143, 0.05));
            border: 1px solid var(--success);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .loyalty-card-cart h4 {
            color: var(--success);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .points-balance {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
        }

        .points-balance span { font-size: 0.8rem; font-weight: 400; color: var(--text-muted); }

        .btn-redeem {
            width: 100%;
            padding: 10px;
            background: var(--success);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-redeem:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .btn-redeem.active {
            background: transparent;
            border: 1px solid var(--success);
            color: var(--success);
        }

        .empty-cart {
            text-align: center;
            padding: 50px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <nav class="navbar glass-panel" style="border-radius: 0; border-bottom: 1px solid var(--panel-border);">
        <a href="menu.html" class="navbar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" y1="2" x2="6" y2="4"></line><line x1="10" y1="2" x2="10" y2="4"></line><line x1="14" y1="2" x2="14" y2="4"></line></svg>
            <span>Smart</span>Café
        </a>
        
        <ul class="nav-links">
            <li><a href="menu.html">Menu</a></li>
            <li><a href="booking.html">Book a Table</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
            <li><a href="dashboard.html">My Orders</a></li>
        </ul>

        <div class="nav-actions">
            <div class="nav-profile" onclick="window.location.href='profile.html'" title="My Profile" style="width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent-color); overflow: hidden; cursor: pointer; margin-left: 10px; display: flex; align-items: center; justify-content: center;">
                <img src="" alt="P" id="navProfilePic" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                <svg id="profilePlaceholder" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <button class="btn-icon" onclick="App.logout()" title="Logout" style="color: var(--danger); border-color: var(--danger); margin-left: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>
    </nav>

    <div style="padding: 20px 5%; margin-top: 10px;">
        <a href="menu.html" class="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Back
        </a>
    </div>

    <div class="layout animate-fade-in" id="cart-container">
        <!-- Rendered by JS -->
    </div>

    <!-- Payment Modal -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content glass-panel" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Secure Checkout</h2>
                <button class="modal-close" onclick="App.closeModal('paymentModal')">×</button>
            </div>
            
            <div style="margin-bottom: 20px;">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Amount to pay</p>
                <h3 id="paymentTotal" style="color: var(--accent-color); font-size: 2rem;">₹0</h3>
            </div>

            <div class="input-group">
                <label>Name on the Order (Like Starbucks!)</label>
                <input type="text" id="orderCustomerName" placeholder="What should we call out? e.g., Rahul" required>
            </div>

            <div class="input-group">
                <label>Payment Method</label>
                <select id="paymentMethod" onchange="togglePaymentFields()">
                    <option value="card">Credit / Debit Card</option>
                    <option value="upi">UPI / QR Code</option>
                </select>
            </div>

            <div id="cardFields">
                <div class="input-group">
                    <label>Card Number</label>
                    <input type="text" placeholder="XXXX XXXX XXXX XXXX">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label>Expiry</label>
                        <input type="text" placeholder="MM/YY">
                    </div>
                    <div class="input-group">
                        <label>CVV</label>
                        <input type="password" placeholder="***">
                    </div>
                </div>
            </div>

            <div id="upiFields" style="display: none; text-align: center;">
                <div style="background: white; padding: 10px; border-radius: 10px; display: inline-block; margin-bottom: 15px;">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=smartcafe@ybl&pn=SmartCafe" alt="UPI QR" style="width: 150px; height: 150px;">
                </div>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Scan to pay via any UPI app</p>
            </div>

            <button class="btn-primary" style="width: 100%; margin-top: 15px;" onclick="processPayment()">
                Pay Securely
            </button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let usePoints = false;
        
        function updateQuantity(index, delta) {
            const item = App.state.cart[index];
            item.quantity += delta;
            if (item.quantity <= 0) {
                App.removeFromCart(index);
            } else {
                App.saveState();
                renderCart();
            }
        }



        function checkout() {
            if(App.state.cart.length === 0) return;
            document.getElementById('paymentTotal').innerText = '₹' + window.currentTotal;
            App.openModal('paymentModal');
        }

        function togglePaymentFields() {
            const method = document.getElementById('paymentMethod').value;
            document.getElementById('cardFields').style.display = method === 'card' ? 'block' : 'none';
            document.getElementById('upiFields').style.display = method === 'upi' ? 'block' : 'none';
        }

        function processPayment() {
            App.closeModal('paymentModal');
            App.showToast('Payment Successful! Processing Order...', 'success');
            
            setTimeout(() => {
                const tableNum = localStorage.getItem('smartCafeTable') || 'Counter';
                const customerName = document.getElementById('orderCustomerName').value || (App.state.user ? App.state.user.name : 'Guest');
                // Add to order history
                const order = {
                    id: '#' + Math.floor(Math.random() * 100000),
                    customerName: customerName,
                    items: [...App.state.cart],
                    date: new Date().toLocaleString(),
                    status: 'Preparing',
                    total: window.currentTotal,
                    table: tableNum
                };
                
                let history = JSON.parse(localStorage.getItem('smartCafeOrders')) || [];
                history.unshift(order);
                localStorage.setItem('smartCafeOrders', JSON.stringify(history));

                // Add points
                if (App.state.user) {
                    App.state.user.points += Math.floor(window.currentTotal * 0.1); // 10% cashback
                }

                // Clear cart
                App.state.cart = [];
                App.saveState();
                
                window.location.href = 'tracking.html';
            }, 1500);
        }

        function renderCart() {
            const container = document.getElementById('cart-container');
            const cart = App.state.cart;
            const user = App.state.user || { points: 0 };

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <h2 style="margin-bottom:15px; color:var(--text-muted)">Your cart is empty</h2>
                        <button class="btn-primary" onclick="window.location.href='menu.html'">Browse Menu</button>
                    </div>
                `;
                return;
            }

            let subtotal = 0;
            let itemsHtml = '<div class="cart-items">';
            
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                const optionsArr = [];
                if (item.options) {
                    if (item.options.milk) optionsArr.push(`Milk: ${item.options.milk}`);
                    if (item.options.sugar) optionsArr.push(`Level: ${item.options.sugar}`);
                    if (item.options.prep) optionsArr.push(`Prep: ${item.options.prep}`);
                    // Any other custom options
                    Object.keys(item.options).forEach(k => {
                        if (!['milk', 'sugar', 'prep'].includes(k)) optionsArr.push(`${k}: ${item.options[k]}`);
                    });
                }
                const optionsStr = optionsArr.join(' | ');

                itemsHtml += `
                    <div class="cart-item stagger-${(index%3)+1} animate-fade-in">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="item-details">
                            <div class="item-title">${item.name}</div>
                            <div class="item-options" style="font-size: 0.75rem; color: var(--accent-color); font-weight: 600; margin-top: 2px;">${optionsStr}</div>
                            <div class="quantity-controls">
                                <button onclick="updateQuantity(${index}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                        </div>
                        <div class="item-price">₹${itemTotal}</div>
                        <button class="remove-btn" onclick="App.removeFromCart(${index})">×</button>
                    </div>
                `;
            });
            itemsHtml += '</div>';

            const tax = Math.round(subtotal * 0.05); // 5% GST
            let discount = 0;
            if (usePoints && user.points > 0) {
                discount = Math.min(user.points, subtotal); // 1 point = 1 rupee
            }
            const total = subtotal + tax - discount;
            window.currentTotal = total; // Save for checkout

            const summaryHtml = `
                <div class="summary-card animate-fade-in">
                    <h3 class="summary-title">Order Summary</h3>
                    
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>₹${subtotal}</span>
                    </div>
                    <div class="summary-row">
                        <span>GST (5%)</span>
                        <span>₹${tax}</span>
                    </div>
 
                    ${user.points > 0 ? `
                    <div class="loyalty-card-cart">
                        <h4>🎁 REWARD CENTER</h4>
                        <div class="points-balance">${user.points} <span>Points Available</span></div>
                        <button class="btn-redeem ${usePoints ? 'active' : ''}" onclick="togglePoints()">
                            ${usePoints ? 'Points Applied ✓' : 'Use Points & Save ₹' + Math.min(user.points, subtotal)}
                        </button>
                    </div>
                    ` : ''}
                    
                    ${discount > 0 ? `
                    <div class="summary-row" style="color: var(--success); font-weight: 800;">
                        <span>Loyalty Discount</span>
                        <span>-₹${discount}</span>
                    </div>
                    ` : ''}
 
                    <div class="summary-row total">
                        <span>Total</span>
                        <span>₹${total}</span>
                    </div>
 
                    <button class="btn-primary" style="width:100%; margin-top:20px; font-size:1.2rem;" onclick="checkout()">
                        Proceed to Pay
                    </button>
                </div>
            `;
 
            container.innerHTML = itemsHtml + summaryHtml;
        }

        function togglePoints() {
            usePoints = !usePoints;
            renderCart();
        }

        // Attach globally for App.js to call
        window.renderCart = renderCart;

        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
        });
    </script>
</body>
</html>
